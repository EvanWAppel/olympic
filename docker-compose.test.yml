# Ephemeral Postgres + Neon HTTP proxy for running the DB-integration tests
# without a remote Neon branch. Used by CI (.github/workflows/ci.yml) and
# usable locally:
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   export DATABASE_URL=postgres://postgres:postgres@localhost:5432/main
#   export NEON_LOCAL_PROXY_URL=http://localhost:4444/sql
#   docker compose -f docker-compose.test.yml exec -T postgres \
#     psql -U postgres -d main -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto'
#   for f in drizzle/*.sql; do
#     docker compose -f docker-compose.test.yml exec -T postgres \
#       psql -U postgres -d main -v ON_ERROR_STOP=1 < "$f"
#   done
#   pnpm test:run
#   docker compose -f docker-compose.test.yml down -v
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d main"]
      interval: 2s
      timeout: 5s
      retries: 20

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/main
    ports:
      - "4444:4444"
    depends_on:
      postgres:
        condition: service_healthy
